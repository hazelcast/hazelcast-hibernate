name: Compatibility Tests
on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
  workflow_call:

jobs:
  get-version-configuration:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'compatibility-sensitive')
    runs-on: ubuntu-slim
    outputs:
      hazelcast-versions: ${{ steps.hazelcast-versions.outputs.hazelcast-versions }}
      latest-hazelcast-version: ${{ steps.hazelcast-versions.outputs.latest-hazelcast-version }}
      jdks: ${{ steps.get-supported-jdks.outputs.jdks }}
      lowest-jdk: ${{ steps.jdks.outputs.lowest-jdk }}
    steps:
      - id: get-maintenance-hazelcast-versions
        uses: hazelcast/hazelcast/.github/actions/get-supported-maintenance-versions@master
      - id: hazelcast-versions
        run: |
          echo "hazelcast-versions=$(jq --compact-output 'map(. | tostring + ".0")' <<< '${{ steps.get-maintenance-hazelcast-versions.outputs.versions }}')" >> ${GITHUB_OUTPUT}
          echo "latest-hazelcast-version=$(jq --raw-output '.[-1] | tostring + ".0"' <<< '${{ steps.get-maintenance-hazelcast-versions.outputs.versions }}')" >> ${GITHUB_OUTPUT}
      - id: get-supported-jdks
        uses: hazelcast/docker-actions/get-supported-jdks@master
        with:
          HZ_VERSION: '${{ steps.hazelcast-versions.outputs.latest-hazelcast-version }}'
      - id: jdks
        run: |
          echo "lowest-jdk=$(jq --raw-output '.[0]' <<< '${{ steps.get-supported-jdks.outputs.jdks }}')" >> ${GITHUB_OUTPUT}

  build:
    runs-on: ubuntu-latest
    needs: get-version-configuration
    strategy:
      fail-fast: false
      matrix:
        hazelcast: ${{ fromJSON(needs.get-version-configuration.outputs.hazelcast-versions) }}
        # Versions marked latest stable and limited-support from https://hibernate.org/orm/releases/
        hibernate: [
          '6.6.59.Final',
          '7.2.25.Final',
          '7.4.13.Final'
        ]
    name: Test against HZ ${{ matrix.hazelcast }} and HN ${{ matrix.hibernate }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.get-version-configuration.outputs.lowest-jdk }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile with default Hazelcast and Hibernate
        run: |
          ./mvnw \
            compile \
            --batch-mode 

      - name: Run tests against HZ ${{ matrix.hazelcast }} and HN ${{ matrix.hibernate }}
        run: |
          ./mvnw \
            verify \
            --batch-mode \
            -Dhazelcast.version=${{ matrix.hazelcast }} \
            -Dhibernate.core.version=${{ matrix.hibernate }} \
            -Dmaven.main.skip=true

  test-jdks:
    runs-on: ubuntu-latest
    needs: get-version-configuration
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(needs.get-version-configuration.outputs.jdks) }}
        jakarta: [ '3.2.0' ]
    name: Test against JDK ${{ matrix.java }} and HZ ${{ needs.get-version-configuration.outputs.latest-hazelcast-version}}
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.get-version-configuration.outputs.lowest-jdk }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile with JDK ${{ needs.get-version-configuration.outputs.lowest-jdk }}
        run: |
          ./mvnw \
            compile \
            --batch-mode 

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests against JDK ${{ matrix.java }} and HZ ${{ needs.get-version-configuration.outputs.latest-hazelcast-version}}
        run: |
          ./mvnw \
            verify \
            --batch-mode \
            --show-version \
            -Dhazelcast.version=${{ needs.get-version-configuration.outputs.latest-hazelcast-version}} \
            -Djakarta.version=${{ matrix.jakarta }} \
            -Dmaven.main.skip=true
